<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Biblioteca · Museario</title>
    <link rel="icon" type="image/svg+xml" href="/museario/favicon.svg" />
    <!--
  Interactive 3D book showcase. Single file, no build step.

  Notes for editing:
  - Book data + procedural cover painters live in the BOOKS array below.
  - Each book has coverURL:null. Drop a direct image URL there and the code
    attempts a CORS texture load, falling back to the painted cover if the
    host does not send Access-Control-Allow-Origin (Amazon image CDNs do not).
  - All geometry, textures, lighting and the environment map are procedural.
-->
    <style>
      :root {
        --navy: #16130f;
        --pink: #c9a35c;
        --cream: #ece8df;
        --lav: #a59d8f;
        --peri: #8d8579;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          120% 100% at 50% 0%,
          #1a1712 0%,
          #121014 55%,
          #0b0a0d 100%
        );
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }

      /* ---------- hero word ---------- */
      .hero-word {
        position: fixed;
        top: 18vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        user-select: none;
        pointer-events: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .hero-word span {
        display: block;
        white-space: nowrap;
        font-size: min(22.5vw, 45vh);
        font-weight: 800;
        letter-spacing: -0.015em;
        line-height: 0.85;
        color: var(--pink);
        animation: heroIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(60px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      body.detail-open .hero-word,
      body.transit .hero-word {
        opacity: 0;
        transform: translateX(-50%) translateY(-44px);
      }

      .dp-autor {
        color: var(--lav);
        font-size: 15px;
        margin: 2px 0 0;
      }
      .dp-autor a {
        color: var(--pink);
        font-weight: 700;
        text-decoration: none;
      }
      .dp-autor a:hover {
        text-decoration: underline;
      }
      body.detail-open .dp-autor a {
        pointer-events: auto;
      }

      /* ---------- canvas ---------- */
      #gl {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: block;
        touch-action: none;
      }

      /* ---------- nav ---------- */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 42px;
        pointer-events: none;
      }
      nav > * {
        pointer-events: auto;
      }
      .logo {
        color: var(--pink);
        font-weight: 800;
        font-size: clamp(20px, 2.2vw, 29px);
        letter-spacing: -0.01em;
      }
      .nav-r {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .menu-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--cream);
        color: var(--navy);
        font-size: 20px;
        font-weight: 800;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cta {
        height: 48px;
        padding: 0 26px;
        border-radius: 999px;
        background: var(--cream);
        color: var(--navy);
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .menu-btn:hover,
      .cta:hover {
        transform: scale(1.05);
      }

      /* ---------- open slip: a torn scrap of page that trails the cursor ----------
         clip-path gives every edge a deckled tear; drop-shadow (not box-shadow)
         is used so the shadow follows the torn silhouette instead of a rectangle.
         Never interactive: the click is handled by the book underneath. */
      #openBtn {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 30;
        padding: 16px 38px 18px;
        border: 0;
        border-radius: 0;
        background:
          repeating-linear-gradient(
            92deg,
            rgba(90, 74, 40, 0.03) 0 2px,
            transparent 2px 6px
          ),
          radial-gradient(
            125% 150% at 28% 0%,
            #fffdf7 0%,
            #f8f2e3 58%,
            #ede4cf 100%
          );
        color: var(--navy);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        clip-path: polygon(
          0% 0.9%,
          8.3% 0.8%,
          16.7% 6.3%,
          25% 3.8%,
          33.3% 5.5%,
          41.7% 2.7%,
          50% 5.2%,
          58.3% 0.4%,
          66.7% 5.9%,
          75% 6.5%,
          83.3% 1%,
          91.7% 6.4%,
          100% 0.7%,
          97.7% 20%,
          97% 40%,
          99.6% 60%,
          98.7% 80%,
          100% 96.5%,
          91.7% 99.8%,
          83.3% 95.6%,
          75% 94.9%,
          66.7% 96.6%,
          58.3% 93.5%,
          50% 97.9%,
          41.7% 99.5%,
          33.3% 93.2%,
          25% 93.6%,
          16.7% 93.2%,
          8.3% 93.1%,
          0% 93.5%,
          0.2% 80%,
          1.1% 60%,
          3.9% 40%,
          3.8% 20%
        );
        filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.16))
          drop-shadow(0 14px 26px rgba(0, 0, 0, 0.4));
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(0.94);
        transition:
          opacity 0.24s ease,
          transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform, opacity, left, top;
      }
      #openBtn.on {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(1);
      }

      /* ---------- close button ---------- */
      #closeBtn {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: transparent;
        color: var(--cream);
        border: 1.5px solid rgba(253, 251, 244, 0.4);
        font-size: 17px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.4s ease 0.15s,
          border-color 0.25s ease;
      }
      #closeBtn:hover {
        border-color: rgba(253, 251, 244, 0.9);
      }
      body.detail-open #closeBtn {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- detail panel ---------- */
      .dp {
        position: fixed;
        right: 7vw;
        top: 50%;
        transform: translateY(-50%);
        width: min(560px, 42vw);
        z-index: 15;
        pointer-events: none;
        visibility: hidden;
        transition: visibility 0s 0.5s;
      }
      body.detail-open .dp {
        visibility: visible;
        transition: visibility 0s 0s;
      }
      .dp > * {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
      }
      body.detail-open .dp > * {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.detail-open .dp > *:nth-child(1) {
        transition-delay: 0.05s;
      }
      body.detail-open .dp > *:nth-child(2) {
        transition-delay: 0.13s;
      }
      body.detail-open .dp > *:nth-child(3) {
        transition-delay: 0.21s;
      }
      body.detail-open .dp > *:nth-child(4) {
        transition-delay: 0.27s;
      }
      body.detail-open .dp > *:nth-child(5) {
        transition-delay: 0.33s;
      }

      .dp h1 {
        margin: 0;
        color: var(--pink);
        font-size: clamp(52px, 5.6vw, 92px);
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.015em;
      }
      .dp p {
        margin: 26px 0 0;
        color: var(--lav);
        font-size: clamp(16px, 1.25vw, 19px);
        line-height: 1.65;
        font-weight: 400;
        max-width: 54ch;
      }
      .meta {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .stars {
        display: flex;
        gap: 5px;
      }
      .stars svg {
        width: 25px;
        height: 25px;
        fill: var(--pink);
      }
      .stars svg.dim {
        opacity: 0.25;
      }
      .sep {
        width: 1px;
        height: 24px;
        background: rgba(200, 208, 240, 0.28);
      }
      .src,
      .year {
        color: #98a4d6;
        font-style: italic;
        font-size: 19px;
      }
      .year {
        margin-left: auto;
      }
      .rule {
        margin-top: 26px;
        border-top: 1px solid rgba(200, 208, 240, 0.18);
      }
      .actions {
        margin-top: 32px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #1a2140;
        border-radius: 999px;
        padding: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
      }
      .pill {
        height: 54px;
        padding: 0 26px;
        border-radius: 999px;
        font-size: 16.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition:
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
          filter 0.2s;
      }
      .pill:hover {
        transform: scale(1.04);
        filter: brightness(1.05);
      }
      .pill.lang {
        background: var(--cream);
        color: var(--navy);
      }
      .pill.buy {
        background: var(--peri);
        color: #10152c;
      }
      .pill.iconb {
        width: 54px;
        padding: 0;
        justify-content: center;
        background: #242c50;
        color: var(--lav);
      }
      .pill svg {
        width: 20px;
        height: 20px;
      }

      /* ---------- portrait / small screens ---------- */
      @media (max-aspect-ratio: 17/20), (max-width: 760px) {
        nav {
          padding: 18px 20px;
        }
        .hero-word {
          top: 7vh;
        }
        .hero-word span {
          font-size: 34vw;
        }
        .dp {
          right: auto;
          left: 50%;
          top: auto;
          bottom: 3.5vh;
          transform: translateX(-50%);
          width: min(560px, 92vw);
        }
        .dp h1 {
          font-size: clamp(36px, 9.5vw, 54px);
        }
        .dp p {
          font-size: 15px;
          margin-top: 16px;
          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .meta {
          margin-top: 18px;
        }
        .rule {
          margin-top: 16px;
        }
        .actions {
          margin-top: 18px;
          flex-wrap: wrap;
          border-radius: 28px;
        }
        .pill {
          height: 48px;
          padding: 0 20px;
          font-size: 15px;
        }
        #closeBtn {
          top: 18px;
          left: auto;
          right: 18px;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
        }
      }

      .webgl-fail {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        color: var(--lav);
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="hero-word"><span>Obras</span></div>

    <canvas id="gl"></canvas>

    <nav>
      <a class="logo" href="/" style="text-decoration:none;display:flex;align-items:center"><img src="/museario/logo-blanco.svg" alt="Museario" style="height:22px;display:block" /></a>
      <div class="nav-r">
        <a class="cta" href="/" style="display:inline-flex;align-items:center;text-decoration:none">museario.art</a>
      </div>
    </nav>

    <button id="openBtn">Ver</button>
    <button id="closeBtn" aria-label="Close detail view">&#10005;</button>

    <div class="dp" id="dp" aria-live="polite">
      <h1 id="dpTitle"></h1>
      <p class="dp-autor">por <span id="dpAutorNombre"></span> · <a id="dpAutorLink" href="#">ver su perfil →</a></p>
      <p id="dpDesc"></p>
      <div class="meta">
        <div class="stars" id="dpStars"></div>
        <div class="sep"></div>
        <div class="src">Museario</div>
        <div class="year" id="dpYear"></div>
      </div>
      <div class="rule"></div>
      <div class="actions">
        <a class="pill buy" id="dpMuseo" style="text-decoration:none;display:inline-flex;align-items:center">Recorrer el museo 3D</a>
        <a class="pill lang" id="dpGaleria" style="text-decoration:none"><span>Ver la galería</span></a>
        <button class="pill iconb" aria-label="Save">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M7 3h10v18l-5-4-5 4z" />
          </svg>
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      /* =========================================================================
   0. Small utilities
   ========================================================================= */
      const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      class Spring {
        constructor(v, k, d) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          this.k = k || 120;
          this.d = d || 14;
        }
        set(v) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          return this;
        }
        update(dt) {
          const a = this.k * (this.t - this.v) - this.d * this.vel;
          this.vel += a * dt;
          this.v += this.vel * dt;
          return this.v;
        }
      }

      function mkCanvas(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }

      function drawSpaced(x, text, cx, y, ls) {
        const prev = x.textAlign;
        x.textAlign = "left";
        const chars = [...text];
        let tot = 0;
        const ws = chars.map((ch) => {
          const w = x.measureText(ch).width;
          tot += w;
          return w;
        });
        tot += ls * (chars.length - 1);
        let px = cx - tot / 2;
        chars.forEach((ch, i) => {
          x.fillText(ch, px, y);
          px += ws[i] + ls;
        });
        x.textAlign = prev;
      }

      function rr(x, px, py, w, h, r) {
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + w, py, px + w, py + h, r);
        x.arcTo(px + w, py + h, px, py + h, r);
        x.arcTo(px, py + h, px, py, r);
        x.arcTo(px, py, px + w, py, r);
        x.closePath();
      }

      /* =========================================================================
   1. Renderer, scene, camera, lights
   ========================================================================= */
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("gl"),
          antialias: true,
          alpha: true,
        });
      } catch (e) {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div class="webgl-fail">This experience needs WebGL, which your browser blocked or does not support.</div>',
        );
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      /* held just under 1 so cover art keeps its printed saturation instead of
         being rolled off toward white by the filmic curve */
      renderer.toneMappingExposure = 0.92;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const ANISO = renderer.capabilities.getMaxAnisotropy();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        26,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0.1, 9.6);

      /* studio environment: painted equirect, prefiltered */
      function envBlob(x, cx, cy, r, rgb, a) {
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
        g.addColorStop(1, "rgba(" + rgb + ",0)");
        x.fillStyle = g;
        x.beginPath();
        x.arc(cx, cy, r, 0, 6.2832);
        x.fill();
      }
      (function buildEnv() {
        const c = mkCanvas(512, 256),
          x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, "#5a6ba6");
        g.addColorStop(0.55, "#262e52");
        g.addColorStop(1, "#0a0d1d");
        x.fillStyle = g;
        x.fillRect(0, 0, 512, 256);
        envBlob(x, 140, 66, 95, "255,255,255", 0.95); // key
        envBlob(x, 405, 84, 55, "255,214,168", 0.55); // warm kicker
        envBlob(x, 256, 150, 120, "255,155,185", 0.28); // pink wash
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(tex).texture;
        tex.dispose();
        pmrem.dispose();
      })();

      const hemi = new THREE.HemisphereLight(0x8fa0d8, 0x0d1024, 0.32);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 0.82);
      key.position.set(3.5, 5, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 20;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xa9b6ff, 0.2);
      fill.position.set(-4, 1, 4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xff9db8, 0.3);
      rim.position.set(-2, 3, -5);
      scene.add(rim);

      /* everything book-related lives under one root so it can be fit-scaled */
      const bookRoot = new THREE.Group();
      scene.add(bookRoot);

      /* =========================================================================
   2. Shared procedural textures
   ========================================================================= */
      function tex(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = ANISO;
        return t;
      }

      function noiseTexture(base, amp, scratches) {
        const s = 256,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        const img = x.createImageData(s, s),
          d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = base + (Math.random() - 0.5) * 2 * amp;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        if (scratches) {
          x.strokeStyle = "rgba(200,200,200,.25)";
          x.lineWidth = 1;
          for (let i = 0; i < 5; i++) {
            x.beginPath();
            const y = Math.random() * s;
            x.moveTo(0, y);
            x.lineTo(s, y + (Math.random() - 0.5) * 22);
            x.stroke();
          }
        }
        return new THREE.CanvasTexture(c);
      }
      const laminateBump = noiseTexture(128, 10, true);
      const clothBump = (function () {
        const s = 128,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, s, s);
        for (let i = 0; i < s; i += 2) {
          x.fillStyle =
            i % 4 === 0 ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.22)";
          x.fillRect(i, 0, 1, s);
          x.fillRect(0, i, s, 1);
        }
        return new THREE.CanvasTexture(c);
      })();

      function striationTexture(vertical) {
        const s = 512,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#ece4d2";
        x.fillRect(0, 0, s, s);
        let p = 0;
        while (p < s) {
          const w = 1 + Math.random() * 2.4,
            tone = Math.random();
          x.fillStyle =
            tone < 0.12
              ? "rgba(140,125,95,.5)"
              : tone < 0.5
                ? "rgba(255,255,252,.55)"
                : "rgba(190,178,150,.45)";
          if (vertical) x.fillRect(p, 0, w, s);
          else x.fillRect(0, p, s, w);
          p += w + 0.6 + Math.random() * 1.6;
        }
        for (let i = 0; i < 2600; i++) {
          x.fillStyle =
            "rgba(120,108,84," + (Math.random() * 0.1).toFixed(3) + ")";
          x.fillRect(Math.random() * s, Math.random() * s, 1.2, 1.2);
        }
        return tex(c);
      }
      const striV = striationTexture(true); // fore edge (±x faces)
      const striH = striationTexture(false); // top and bottom (±y faces)

      const endpaperTex = (function () {
        const s = 512,

      function paintAlchemist(x, w, h) {
        const RED = "#af2024",
          ORANGE = "#e8501f",
          GOLD = "#f2b31c",
          INK = "#2a1508";
        x.fillStyle = RED;
        x.fillRect(0, 0, w, h);

        x.fillRect(38, 38, w - 76, h - 76);
        x.strokeStyle = GOLD;
        x.lineWidth = 3;
        x.strokeRect(20, 20, w - 40, h - 40);

        const cx = w / 2,
          cy = 700,
          R = 292;
        x.save();
        x.beginPath();
        x.rect(38, 38, w - 76, h - 76);
        x.clip();

        /* radiating rays + diamond studs */
        for (let i = 0; i < 32; i++) {
          const a = (i / 32) * 6.2832 + 0.098;
          x.save();
          x.translate(cx, cy);
          x.rotate(a);
          x.fillStyle = "rgba(242,179,28,.85)";
          x.beginPath();
          x.moveTo(R + 8, -13);
          x.lineTo(1180, 0);
          x.lineTo(R + 8, 13);
          x.closePath();
          x.fill();
          for (let d = 0; d < 4; d++) {
            const rd = R + 120 + d * 190,
              sz = 20 - d * 2;
            x.fillStyle = d % 2 ? "rgba(242,179,28,.95)" : "rgba(175,32,36,.9)";
            x.beginPath();
            x.moveTo(rd, -sz);
            x.lineTo(rd + sz, 0);
            x.lineTo(rd, sz);
            x.lineTo(rd - sz, 0);
            x.closePath();
            x.fill();
          }
          x.restore();
        }

        /* scalloped medallion */
        x.fillStyle = "#b8351f";
        for (let i = 0; i < 30; i++) {
          const a = (i / 30) * 6.2832;
          x.beginPath();
          x.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 34, 0, 6.2832);
          x.fill();
        }
        x.fillStyle = GOLD;
        x.beginPath();
        x.arc(cx, cy, R - 4, 0, 6.2832);
        x.fill();
        x.strokeStyle = "#b8351f";
        x.lineWidth = 7;
        x.beginPath();
        x.arc(cx, cy, R - 26, 0, 6.2832);
        x.stroke();
        x.fillStyle = "#b8351f";
        for (let i = 0; i < 64; i++) {
          const a = (i / 64) * 6.2832;
          x.beginPath();
          x.arc(cx + Math.cos(a) * (R - 46), cy + Math.sin(a) * (R - 46), 5, 0, 6.2832);
          x.fill();
        }
        /* faint map contours inside the medallion */
        x.save();
        x.beginPath();
        x.arc(cx, cy, R - 56, 0, 6.2832);
        x.clip();
        x.strokeStyle = "rgba(199,100,0,.55)";
        x.lineWidth = 4;
        for (let i = 0; i < 5; i++) {
          const yy = cy - 150 + i * 78;
          x.beginPath();
          x.moveTo(cx - 240, yy);
          x.bezierCurveTo(cx - 90, yy - 34, cx + 80, yy + 34, cx + 240, yy - 6);
          x.stroke();
        }
        x.restore();
        x.restore();

        /* title block, sized to sit inside the medallion */
        x.fillStyle = INK;
        x.textAlign = "center";
        x.font = "italic 74px Georgia";
        x.fillText("The", cx, 638);
        x.textAlign = "left";
        x.font = "700 78px Georgia";
        drawSpaced(x, "ALCHEMIST", cx, 748, 3);
        x.textAlign = "center";
        x.fillStyle = "#8f2a12";
        x.font = "italic 40px Georgia";
        x.fillText("25th", cx, 826);
        x.textAlign = "left";
        x.font = "600 20px Arial";
        drawSpaced(x, "ANNIVERSARY", cx, 862, 6);
        drawSpaced(x, "EDITION", cx, 890, 6);

        /* author + corner glyphs */
        x.fillStyle = INK;
        x.font = "700 66px Georgia";
        drawSpaced(x, "PAULO COELHO", cx, 1382, 4);
        x.fillStyle = "rgba(242,179,28,.9)";
        [
          [140, 1400],
          [w - 140, 1400],
        ].forEach(([px, py]) => {
          x.beginPath();
          x.moveTo(px, py - 62);
          x.lineTo(px + 58, py);
          x.lineTo(px - 58, py);
          x.closePath();
          x.fill();
        });
        [
          [128, 118],
          [w - 128, 118],
        ].forEach(([px, py]) => {
          x.beginPath();
          x.moveTo(px - 46, py);
          x.quadraticCurveTo(px - 14, py - 30, px, py + 6);
          x.quadraticCurveTo(px + 14, py - 30, px + 46, py);
          x.quadraticCurveTo(px + 12, py + 4, px, py + 30);
          x.quadraticCurveTo(px - 12, py + 4, px - 46, py);
          x.closePath();
          x.fill();
        });

        envMapIntensity: 0.2,
      });
      const striMatV = std({
        map: striV,
        bumpMap: striV,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const striMatH = std({
        map: striH,
        bumpMap: striH,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const endpaperMat = std({
        map: endpaperTex,
        roughness: 0.9,
        envMapIntensity: 0.25,
      });
      const pageMats = [0xf4eee0, 0xf1ebdb, 0xf6f0e3].map((c) =>
        std({
          color: c,
          roughness: 0.92,
          envMapIntensity: 0.22,
          side: THREE.DoubleSide,
        }),
      );

      const books = [];
      const hitMeshes = [];

      function buildBook(cfg, index) {
        const root = new THREE.Group();
        const float = new THREE.Group();
        root.add(float);
        bookRoot.add(root);

        /* painted textures */
        const fc = mkCanvas(1024, 1536);
        cfg.front(fc.getContext("2d"), 1024, 1536);
        const bc = mkCanvas(1024, 1536);
        paintBack(bc.getContext("2d"), 1024, 1536, cfg);
        const sc = mkCanvas(220, 1536);
        paintSpine(sc.getContext("2d"), 220, 1536, cfg);
        const frontTex = tex(fc),
          backTex = tex(bc),
          spineTex = tex(sc);

        /* printed boards: matte enough that the environment reads as a soft sheen
           rather than a wash over the artwork */
        const mEdge = std({
          color: cfg.edge,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.68,
          envMapIntensity: 0.3,
        });
        const mFront = std({
          map: frontTex,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.54,
          envMapIntensity: 0.28,
        });
        const mBack = std({
          map: backTex,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.58,
          envMapIntensity: 0.26,
        });
        const mSpine = std({
          map: spineTex,
          bumpMap: clothBump,
          bumpScale: 0.006,
          roughness: 0.78,
          envMapIntensity: 0.22,
        });

        /* optional real cover art, CORS permitting */
        if (cfg.coverURL) {
          new THREE.TextureLoader().setCrossOrigin("anonymous").load(
            cfg.coverURL,
            (t) => {
              t.encoding = THREE.sRGBEncoding;
              t.anisotropy = ANISO;
              mFront.map = t;
              mFront.needsUpdate = true;
            },
            undefined,
            () =>
              console.warn(
                "Cover blocked by CORS, procedural kept:",
                cfg.title,
              ),
          );
        }

        /* back cover, hinged at the spine, opens away from the block */
        const backPivot = new THREE.Group();
        backPivot.position.set(-W / 2, 0, BPIVOT_Z);
        const backMesh = new THREE.Mesh(coverGeo, [
          mEdge,
          mEdge,
          mEdge,
          mEdge,
          endpaperMat,
          mBack,
        ]);
        backMesh.position.x = (W + OV) / 2;
        backMesh.castShadow = backMesh.receiveShadow = true;
        backPivot.add(backMesh);
        float.add(backPivot);

        /* front cover, hinged at the spine */
        const pivot = new THREE.Group();
        pivot.position.set(-W / 2, 0, PIVOT_Z);
        const frontMesh = new THREE.Mesh(coverGeo, [
          mEdge,
          mEdge,
          mEdge,
          mEdge,
          mFront,
          endpaperMat,
        ]);
        frontMesh.position.x = (W + OV) / 2;
        frontMesh.castShadow = frontMesh.receiveShadow = true;
        pivot.add(frontMesh);
        float.add(pivot);

        /* cloth spine */
        const spine = new THREE.Mesh(spineGeo, mSpine);
        spine.position.set(-W / 2 - 0.013, 0, 0);
        spine.castShadow = true;
        float.add(spine);

        /* page block with striated edges */
        const block = new THREE.Mesh(blockGeo, [
          striMatV,
          paperFlat,
          striMatH,
          striMatH,
          paperFlat,
          paperFlat,
        ]);
        block.position.set(-0.0075, 0, BLOCK_Z);
        block.castShadow = block.receiveShadow = true;
        float.add(block);

        /* individually hinged top sheets */
        const pages = [],
          pageF = [];
        for (let i = 0; i < PAGE_N; i++) {
          const pp = new THREE.Group();
          pp.position.set(
            -W / 2 + 0.01,
            (Math.random() - 0.5) * 0.006,
            0.166 - i * 0.0042,
          );
          const pm = new THREE.Mesh(pageGeo, pageMats[i % 3]);
          pm.position.x = PW / 2;
          pm.rotation.z = (Math.random() - 0.5) * 0.006;
          pp.add(pm);
          float.add(pp);
          pages.push(pp);
          pageF.push(0.3 * Math.pow(1 - i / PAGE_N, 2.6));
        }

        /* hinged rear sheets, revealed when the back cover fans */
        const pagesB = [],
          pageFB = [];
        for (let i = 0; i < 6; i++) {
          const pp = new THREE.Group();
          pp.position.set(
            -W / 2 + 0.01,
            (Math.random() - 0.5) * 0.006,
            -0.166 + i * 0.0042,
          );
          const pm = new THREE.Mesh(pageGeo, pageMats[i % 3]);
          pm.position.x = PW / 2;
          pm.rotation.z = (Math.random() - 0.5) * 0.006;
          pp.add(pm);
          float.add(pp);
          pagesB.push(pp);
          pageFB.push(0.3 * Math.pow(1 - i / 6, 2.6));
        }

        /* soft blob shadow against the background */
        const blob = new THREE.Mesh(
          blobGeo,
          new THREE.MeshBasicMaterial({
            map: blobTex,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
          }),
        );
        blob.scale.set(3.1, 3.9, 1);
        blob.position.set(0.1, -0.3, -0.85);
        blob.renderOrder = -5;
        root.add(blob);

        /* invisible raycast target */
        const hit = new THREE.Mesh(hitGeo, hitMat);
        float.add(hit);
        hitMeshes.push(hit);

        const springs = {
          px: new Spring(0, 17, 6.8),
          py: new Spring(0, 17, 6.8),
          pz: new Spring(0, 17, 6.8),
          rx: new Spring(0, 17, 6.8),
          ry: new Spring(0, 17, 6.8),
          rz: new Spring(0, 17, 6.8),
          sc: new Spring(1, 17, 6.8),
          tiltX: new Spring(0, 120, 13),
          tiltY: new Spring(0, 120, 13),
          lift: new Spring(0, 120, 13),
          cover: new Spring(0, 90, 12),
          coverB: new Spring(0, 90, 12),
          drag: new Spring(0, 160, 16),
        };

        const b = {
          cfg,
          index,
          root,
          float,
          pivot,
          backPivot,
          frontMesh,
          spine,
          block,
          pages,
          pageF,
          pagesB,
          pageFB,
          hit,
          springs,
          phase: Math.random() * 6.28,
          slotScale: 1,
          hitEdge: null,
          scr: { x: 0, y: 0 },
          orbY: 0,
          orbYv: 0,
          orbPhase: "idle",
          orbTarget: 0,
          orbXs: new Spring(0, 60, 12),
          exit: null,
        };
        books.push(b);
        return b;
      }
      BOOKS.forEach(buildBook);
      const bookByHit = (m) => books.find((b) => b.hit === m);

      /* =========================================================================
   5. Floating leaves (detail view)
   ========================================================================= */
      const leaves = { items: [], anchor: null };
      (function buildLeaves() {
        const shape = new THREE.Shape();
        shape.moveTo(0, -0.5);
        shape.bezierCurveTo(0.3, -0.28, 0.3, 0.22, 0, 0.55);
        shape.bezierCurveTo(-0.3, 0.22, -0.3, -0.28, 0, -0.5);
        const geo = new THREE.ShapeGeometry(shape, 10);
        const cols = [0x3e7c3f, 0x57944a, 0x2f6136, 0x6aa557];
        for (let i = 0; i < 16; i++) {
          const mat = std({
            color: cols[i % 4],
            roughness: 0.55,
            envMapIntensity: 0.3,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.visible = false;
          bookRoot.add(mesh);
          let hx = (Math.random() - 0.5) * 4.6;
          if (i % 5 === 0) hx += 2.8 * Math.sign(hx || 1);
          leaves.items.push({
            mesh,
            hx,
            hy: (Math.random() - 0.5) * 3.2,
            hz: -0.5 + Math.random() * 1.5,
            sp: 0.25 + Math.random() * 0.5,
            ph: Math.random() * 6.28,
            rv: new THREE.Vector3(
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8,
            ),
            kick: new THREE.Vector3(),
            size: 0.14 + Math.random() * 0.16,
            s: new Spring(0, 60, 10),
          });
        }
      })();
      leaves.activate = function (book) {
        this.anchor = book;
        this.items.forEach((l) => {
          l.kick.set(
            -l.hx + (Math.random() - 0.5) * 0.6,
            -l.hy + (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.5,
          );
          l.s.t = l.size;
          l.mesh.visible = true;
        });
      };
      leaves.deactivate = function () {
        this.items.forEach((l) => {
          l.s.t = 0;
        });
      };
      leaves.push = function (dx, dy) {
        if (!this.anchor) return;
        this.items.forEach((l) => {
          l.kick.x += dx * 2.4 * Math.random();
          l.kick.y += -dy * 2.4 * Math.random();
        });
      };
      leaves.update = function (dt, t) {
        if (!this.anchor) return;
        const ap = this.anchor.root.position;
        const w = RM ? 0.15 : 1;
        this.items.forEach((l) => {
          l.kick.multiplyScalar(Math.exp(-1.15 * dt));
          l.mesh.position.set(
            ap.x + l.hx + Math.sin(t * l.sp + l.ph) * 0.4 * w + l.kick.x,
            ap.y +
              l.hy +
              Math.cos(t * l.sp * 0.83 + l.ph * 1.3) * 0.3 * w +
              l.kick.y,
            ap.z * 0.4 + l.hz + l.kick.z,
          );
          l.mesh.rotation.x += l.rv.x * dt * (0.3 + w);
          l.mesh.rotation.y += l.rv.y * dt * (0.3 + w);
          l.mesh.rotation.z += l.rv.z * dt * (0.3 + w);
          const s = l.s.update(dt);
          l.mesh.scale.setScalar(Math.max(s, 0.0001));
          if (l.s.t === 0 && s < 0.01) l.mesh.visible = false;
        });
      };

      /* =========================================================================
   6. Layout slots + state machine
   ========================================================================= */
      const state = {
        mode: "hero",
        selected: null,
        hovered: null,
        pillLock: null,
        kbIndex: -1,
      };
      const SLOTS = { hero: [], detail: null, portrait: false };

      function computeSlots() {
        const a = window.innerWidth / Math.max(1, window.innerHeight);
        const fit = clamp(a / 1.75, 0.56, 1);
        bookRoot.scale.setScalar(fit);
        bookRoot.position.y = -(1 - fit) * 0.55;
        SLOTS.portrait = a < 0.85;

        /* hero: tight fan, center book dominant, tops at ~30vh / ~53vh like the reference */
        SLOTS.hero = SLOTS.portrait
          ? [
              { p: [-1.72, -1.15, -0.3], r: [-0.045, 0.44, 0.19], s: 1.18 },
              { p: [-0.52, -0.55, 0.5], r: [-0.05, 0.12, 0.04], s: 1.36 },
              { p: [0.78, -0.55, 0.55], r: [-0.05, -0.12, -0.04], s: 1.36 },
              { p: [2.0, -1.2, -0.4], r: [-0.045, -0.46, -0.18], s: 1.18 },
            ]
          : [
              { p: [-3.1, -1.32, -0.25], r: [-0.045, 0.46, 0.19], s: 1.26 },
              { p: [-1.02, -1.1, 0.5], r: [-0.05, 0.13, 0.04], s: 1.46 },
              { p: [1.28, -1.1, 0.55], r: [-0.05, -0.13, -0.04], s: 1.46 },
              { p: [3.4, -1.44, -0.4], r: [-0.045, -0.48, -0.18], s: 1.26 },
            ];

        if (SLOTS.portrait) {
          /* center the book in the region between the nav and the info sheet */
          const el = document.getElementById("dp");
          const panelH =
            el && el.offsetHeight > 40 ? el.offsetHeight : innerHeight * 0.44;
          const gap = innerHeight * 0.035,
            navB = innerHeight * 0.1;
          const freeTop = navB;
          const freeBot = Math.max(innerHeight - panelH - gap, freeTop + 140);
          const midPx = (freeTop + freeBot) / 2;
          const T13 = 0.23087,
            camZp = 9.9,
            zw = 0.8 * fit,
            rootY = -(1 - fit) * 0.55;
          const yw = 0.1 + (1 - (2 * midPx) / innerHeight) * T13 * (camZp - zw);
          const availW =
            (((freeBot - freeTop) * 0.92) / innerHeight) *
            2 *
            T13 *
            (camZp - zw);
          const s = clamp(availW / fit / 2.3, 0.5, 1.15);
          SLOTS.detail = {
            p: [0, (yw - rootY) / fit, 0.8],
            r: [-0.02, -0.4, 0.06],
            s: s,
          };
        } else {
          SLOTS.detail = {
            p: [-1.95, 0.0, 1.1],
            r: [0.02, -0.52, 0.1],
            s: 1.26,
          };
        }
      }

      function setTargets(b, slot) {
        const s = b.springs;
        s.px.t = slot.p[0];
        s.py.t = slot.p[1];
        s.pz.t = slot.p[2];
        s.rx.t = slot.r[0];
        s.ry.t = slot.r[1];
        s.rz.t = slot.r[2];
        b.slotScale = slot.s;
      }

      /* ---------------------------------------------------------------------
         Exit / return motion.

         A spring aimed far below the frame accelerates the whole way, which
         reads as a fast drop. Instead the vertical axis is handed to a small
         keyframed tween for the duration of the move, so the curve is designed:
         a soft decelerating lift, a beat of hang time, then a long glide down
         that eases in and out. Closing plays the same idea in reverse.
         --------------------------------------------------------------------- */
      const EASE = {
        hold: () => 1,
        /* short tail: reaches the apex without loitering there */
        outQuad: (t) => 1 - (1 - t) * (1 - t),
        outQuint: (t) => 1 - Math.pow(1 - t, 5),
        /* leaves rest promptly, still zero velocity at both ends */
        inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
      };

      const LIFT = 0.38, /* how far the book floats up before letting go */
        CLEAR = 4.2; /* far enough below its slot to be out of frame */

      function playY(b, segs) {
        b.exit = { segs, i: 0, t: 0 };
      }

      /* advances the tween and writes straight into the y spring, keeping the
         spring inert so it neither fights the curve nor snaps at handover */
      function stepY(b, dt) {
        const ex = b.exit,
          s = b.springs;
        ex.t += dt;
        let seg = ex.segs[ex.i];
        while (seg && ex.t >= seg.d) {
          ex.t -= seg.d;
          s.py.v = seg.to;
          if (seg.end) seg.end();
          seg = ex.segs[++ex.i];
        }
        if (seg) s.py.v = seg.from + (seg.to - seg.from) * seg.ease(ex.t / seg.d);
        else b.exit = null;
        s.py.t = s.py.v;
        s.py.vel = 0;
      }

      /* x, z and rotation are pinned to wherever the book already stands, so the
         whole move happens on the y axis and nothing slides sideways */
      function pinInPlace(b) {
        const s = b.springs;
        s.px.t = s.px.v;
        s.pz.t = s.pz.v;
        s.rx.t = s.rx.v;
        s.ry.t = s.ry.v;
        s.rz.t = s.rz.v;
      }

      function sendOut(b, i, delay) {
        const y0 = SLOTS.hero[i].p[1],
          here = b.springs.py.v,
          apex = y0 + LIFT;
        b.root.visible = true;
        pinInPlace(b);
        playY(b, [
          { d: delay, from: here, to: here, ease: EASE.hold },
          { d: 0.28, from: here, to: apex, ease: EASE.outQuad },
          {
            d: 0.9,
            from: apex,
            to: y0 - CLEAR,
            ease: EASE.inOutSine,
            end: () => {
              b.root.visible = false;
            },
          },
        ]);
      }

      function bringBack(b, i, delay) {
        const here = b.springs.py.v;
        b.root.visible = true;
        pinInPlace(b);
        playY(b, [
          { d: delay, from: here, to: here, ease: EASE.hold },
          { d: 1.0, from: here, to: SLOTS.hero[i].p[1], ease: EASE.outQuint },
        ]);
      }

      function applyMode() {
        if (state.mode === "hero" || state.mode === "closing") {
          books.forEach((b, i) => setTargets(b, SLOTS.hero[i]));
        } else if (state.selected) {
          /* only the open book is retargeted; the other two keep the x, z and
             rotation they stood at while their y is tween-driven */
          setTargets(state.selected, SLOTS.detail);
        }
      }

      /* camera springs */
      const camX = new Spring(0, 13, 6.5),
        camY = new Spring(0.1, 13, 6.5),
        camZ = new Spring(9.6, 13, 6.5);
      const lookX = new Spring(0, 13, 6.5),
        lookY = new Spring(0, 13, 6.5);
      const parX = new Spring(0, 60, 10),
        parY = new Spring(0, 60, 10);

      function camTo(mode) {
        if (mode === "detail") {
          camX.t = SLOTS.portrait ? 0 : -0.4;
          camZ.t = SLOTS.portrait ? 9.9 : 8.9;
          lookX.t = SLOTS.portrait ? 0 : -0.5;
          lookY.t = SLOTS.portrait ? 0 : 0.15;
        } else {
          camX.t = 0;
          camZ.t = 9.6;
          lookX.t = 0;
          lookY.t = 0;
        }
      }

      /* detail panel */
      const dpTitle = document.getElementById("dpTitle");
      const dpDesc = document.getElementById("dpDesc");
      const dpStars = document.getElementById("dpStars");
      const dpYear = document.getElementById("dpYear");
      const STAR =
        '<svg viewBox="0 0 24 24" class="CLS"><path d="M12 2.6l2.8 6 6.6.6-5 4.4 1.5 6.5L12 16.7 6.1 20.1l1.5-6.5-5-4.4 6.6-.6z"/></svg>';
      const dpMuseo = document.getElementById("dpMuseo");
      const dpGaleria = document.getElementById("dpGaleria");
      const dpAutorNombre = document.getElementById("dpAutorNombre");
      const dpAutorLink = document.getElementById("dpAutorLink");
      function populatePanel(cfg) {
        dpAutorNombre.textContent = cfg.author;
        if (cfg.perfil) dpAutorLink.href = cfg.perfil;
        if (cfg.museo) dpMuseo.href = cfg.museo;
        if (cfg.galeria) dpGaleria.href = cfg.galeria;
        dpTitle.textContent = cfg.title;
        dpDesc.textContent = cfg.desc;
        dpYear.textContent = cfg.year;
        let s = "";
        for (let i = 0; i < 5; i++)
          s += STAR.replace("CLS", i < cfg.stars ? "" : "dim");
        dpStars.innerHTML = s;
      }

      const pill = document.getElementById("openBtn");
      /* the slip trails the cursor with a touch of lag */
      const pillX = new Spring(0, 190, 23),
        pillY = new Spring(0, 190, 23);
      let pillOn = false;
      function hidePill() {
        pill.classList.remove("on");
        pillOn = false;
      }

      function open(book) {
        if (state.mode !== "hero" || !book) return;
        state.mode = "opening";
        state.selected = book;
        state.pillLock = null;
        state.kbIndex = -1;
        hidePill();
        book.exit = null; /* hand y back to the spring if it was still tweening */
        document.body.classList.add("transit");
        populatePanel(book.cfg);
        computeSlots();

        /* beat one: the other two lift and drop away. the chosen book holds its
           ground here, so nothing crosses paths with them. */
        let out = 0;
        books.forEach((b, i) => {
          if (b !== book) sendOut(b, i, out++ * 0.08); /* slight stagger */
        });

        /* beat two, the moment they are clear: the chosen book turns and crosses
           to the detail slot, and the frame pans with it */
        setTimeout(() => {
          if (state.mode !== "opening" && state.mode !== "detail") return;
          book.orbY = RM ? 0 : -6.2832;
          book.orbYv = RM ? 0 : 3;
          book.orbPhase = "return";
          book.orbTarget = 0;
          book.orbXs.set(0);
          applyMode();
          camTo("detail");
        }, 760);
        setTimeout(() => leaves.activate(book), 1000);
        setTimeout(() => {
          if (state.mode === "opening") {
            document.body.classList.add("detail-open");
            state.mode = "detail";
          }
        }, 1400);
      }

      function close() {
        if (state.mode !== "detail") return;
        state.mode = "closing";
        document.body.classList.remove("detail-open");
        leaves.deactivate();
        orbit.drag = false;
        const b = state.selected;
        if (b) {
          /* one clean turn on the way home, landing front-on */
          b.orbTarget = Math.round(b.orbY / 6.2832) * 6.2832 + 6.2832;
          b.orbYv = Math.max(b.orbYv, 3);
          b.orbPhase = "return";
          b.orbXs.t = 0;
        }
        setTimeout(() => {
          document.body.classList.remove("transit");
          applyMode();
          camTo("hero");
          /* and they only climb back once the frame has finished returning */
          let back = 0;
          books.forEach((bk, i) => {
            if (bk !== b) bringBack(bk, i, 0.85 + back++ * 0.1);
          });
        }, 250);
        setTimeout(() => {
          if (state.mode === "closing") {
            state.mode = "hero";
            state.selected = null;
          }
        }, 1600);
      }

      document.getElementById("closeBtn").addEventListener("click", close);
      /* the slip is never a hit target — clicking the book under it opens it,
         which is also what keeps it able to follow the cursor */

      /* =========================================================================
   7. Input: pointer as hand, drag to peel, keyboard
   ========================================================================= */
      const ptr = {
        ndcX: 0,
        ndcY: 0,
        cx: innerWidth / 2,
        cy: innerHeight / 2,
        lastX: 0,
        lastY: 0,
        down: false,
        downX: 0,
        downY: 0,
        moved: 0,
        t0: 0,
        type: "mouse",
        seen: false,
        id: null, /* only the first finger down drives the scene */
      };
      const isTouch = () => ptr.type === "touch" || ptr.type === "pen";
      let dragBook = null,
        rayBook = null;
      const orbit = { drag: false, dxAcc: 0, dyAcc: 0 };
      const ray = new THREE.Raycaster();
      const tmpV = new THREE.Vector3();

      const canvas = renderer.domElement;
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      /* pointer off the canvas: nothing is hovered, so the slip goes away */
      canvas.addEventListener("pointerleave", () => {
        rayBook = null;
        state.pillLock = null;
        state.kbIndex = -1;
      });

      canvas.addEventListener("pointermove", (e) => {
        if (ptr.id !== null && e.pointerId !== ptr.id) return;
        const dxN = (e.clientX - ptr.lastX) / innerWidth;
        const dyN = (e.clientY - ptr.lastY) / innerHeight;
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;
        ptr.cx = e.clientX;
        ptr.cy = e.clientY;
        ptr.ndcX = (e.clientX / innerWidth) * 2 - 1;
        ptr.ndcY = -(e.clientY / innerHeight) * 2 + 1;
        ptr.type = e.pointerType || "mouse";
        ptr.seen = true;
        if (state.mode === "detail") leaves.push(dxN, dyN);
        if (ptr.down && dragBook) {
          ptr.moved += Math.abs(dxN * innerWidth) + Math.abs(dyN * innerHeight);
          dragBook.springs.drag.t = clamp(
            ((ptr.downX - e.clientX) / innerWidth) * 3.4,
            0,
            1.0,
          );
        }
        if (ptr.down && orbit.drag) {
          orbit.dxAcc += dxN;
          orbit.dyAcc += dyN;
          ptr.moved += Math.abs(dxN * innerWidth) + Math.abs(dyN * innerHeight);
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        if (ptr.id !== null) return; /* a second finger must not hijack the drag */
        ptr.id = e.pointerId;
        ptr.cx = e.clientX;
        ptr.cy = e.clientY;
        /* seed the move baseline: without this, a touch's first pointermove
           measures from wherever the pointer was last seen and the resulting
           jump is mistaken for a drag, so taps never open a book */
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;
        ptr.ndcX = (e.clientX / innerWidth) * 2 - 1;
        ptr.ndcY = -(e.clientY / innerHeight) * 2 + 1;
        ptr.type = e.pointerType || "mouse";
        ptr.seen = true;
        castRay();
        if (state.mode === "hero" && rayBook) {
          ptr.down = true;
          dragBook = rayBook;
          ptr.downX = e.clientX;
          ptr.downY = e.clientY;
          ptr.moved = 0;
          ptr.t0 = performance.now();
          canvas.setPointerCapture(e.pointerId);
        } else if (state.mode === "detail" && rayBook === state.selected) {
          ptr.down = true;
          orbit.drag = true;
          orbit.dxAcc = 0;
          orbit.dyAcc = 0;
          ptr.moved = 0;
          ptr.t0 = performance.now();
          canvas.setPointerCapture(e.pointerId);
        } else {
          state.pillLock = null;
          state.kbIndex = -1;
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (ptr.id !== null && e.pointerId !== ptr.id) return;
        ptr.id = null;
        orbit.drag = false;
        if (dragBook) {
          /* fingers wobble and press longer than a mouse click, so a tap gets a
             wider slop radius and a longer window before it counts as a drag */
          const slop = isTouch() ? 26 : 14;
          const limit = isTouch() ? 650 : 450;
          const wasDrag = ptr.moved > slop;
          dragBook.springs.drag.t = 0;
          if (
            !wasDrag &&
            state.mode === "hero" &&
            performance.now() - ptr.t0 < limit
          )
            open(dragBook); /* one tap opens, on touch as well as mouse */
          dragBook = null;
        }
        ptr.down = false;
        /* touch has no hover: drop the hit so the book does not stay lifted */
        if (isTouch()) rayBook = null;
      });

      /* the OS can take a gesture away (scroll, palm, call). without this the
         book would stay peeled open and the drag state would never clear */
      function cancelPointer(e) {
        if (e && ptr.id !== null && e.pointerId !== ptr.id) return;
        ptr.id = null;
        ptr.down = false;
        orbit.drag = false;
        if (dragBook) {
          dragBook.springs.drag.t = 0;
          dragBook = null;
        }
        if (isTouch()) rayBook = null;
      }
      window.addEventListener("pointercancel", cancelPointer);
      canvas.addEventListener("lostpointercapture", cancelPointer);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
        if (state.mode !== "hero") return;
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          const d = e.key === "ArrowRight" ? 1 : -1;
          state.kbIndex =
            ((state.kbIndex < 0 ? (d > 0 ? -1 : 1) : state.kbIndex) + d + 3) %
            3;
          state.pillLock = null;
          e.preventDefault();
        }
        if (e.key === "Enter" && state.hovered) open(state.hovered);
      });

      function castRay() {
        ray.setFromCamera({ x: ptr.ndcX, y: ptr.ndcY }, camera);
        const hits = ray.intersectObjects(hitMeshes, false);
        if (hits.length) {
          rayBook = bookByHit(hits[0].object);
          const lp = rayBook.hit.worldToLocal(hits[0].point.clone());
          rayBook.hitEdge = clamp((lp.x / 0.9) * 0.5 + 0.5, 0, 1);
        } else {
          rayBook = null;
        }
      }

      /* =========================================================================
   8. Frame loop
   ========================================================================= */
      const clock = new THREE.Clock();
      const idle = RM ? 0 : 1;

      function screenPos(b) {
        b.root.getWorldPosition(tmpV).project(camera);
        b.scr.x = (tmpV.x * 0.5 + 0.5) * innerWidth;
        b.scr.y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      }

      function tickBook(b, dt, t) {
        const s = b.springs;
        const isHov = state.hovered === b;
        const inDetail = state.mode === "detail" && state.selected === b;
        const orbitActive = state.selected === b && state.mode !== "hero";

        /* --- orbit: drag to tumble, flick to spin, settle facing front --- */
        let activity = 0;
        if (orbitActive) {
          if (orbit.drag && inDetail) {
            const step = orbit.dxAcc * 6.5;
            orbit.dxAcc = 0;
            b.orbY += step;
            b.orbYv = clamp(
              b.orbYv * 0.5 + (step / Math.max(dt, 0.001)) * 0.5,
              -14,
              14,
            );
            b.orbXs.t = clamp(b.orbXs.t + orbit.dyAcc * 3.2, -0.55, 0.55);
            orbit.dyAcc = 0;
            b.orbPhase = "drag";
          } else {
            b.orbXs.t = 0;
            if (b.orbPhase === "drag") {
              if (Math.abs(b.orbYv) > 0.6) {
                b.orbPhase = "spin";
              } else {
                b.orbPhase = "return";
                b.orbTarget =
                  Math.round((b.orbY + b.orbYv * 1.2) / Math.PI) * Math.PI;
              }
            }
            if (b.orbPhase === "spin") {
              b.orbYv *= Math.exp(-0.9 * dt);
              b.orbY += b.orbYv * dt;
              if (Math.abs(b.orbYv) < 0.5) {
                b.orbPhase = "return";
                b.orbTarget =
                  Math.round((b.orbY + b.orbYv * 1.2) / Math.PI) * Math.PI;
              }
            } else if (b.orbPhase === "return") {
              const acc = 16 * (b.orbTarget - b.orbY) - 8 * b.orbYv;
              b.orbYv += acc * dt;
              b.orbY += b.orbYv * dt;
              if (
                Math.abs(b.orbTarget - b.orbY) < 0.002 &&
                Math.abs(b.orbYv) < 0.01
              ) {
                b.orbY = b.orbTarget;
                b.orbYv = 0;
                b.orbPhase = "idle";
              }
            }
          }
          const distRest = Math.abs(
            b.orbY - Math.round(b.orbY / 6.2832) * 6.2832,
          );
          activity = clamp(
            Math.abs(b.orbYv) * 1.5 + (orbit.drag ? 1 : 0) + distRest * 2,
            0,
            1,
          );
        }
        b.orbXs.update(dt);

        /* --- targets --- */
        let coverBase = 0;
        if (inDetail)
          coverBase =
            0.02 +
            (0.13 + Math.sin(t * 0.8 + b.phase) * 0.015 * idle) *
              (1 - activity);
        /* cover inertia: the trailing board gets flung open by the spin.
     positive spin flings the front cover, negative spin the back cover */
        const fan = orbitActive ? clamp(b.orbYv * 0.16, 0, 0.75) : 0;
        const fanB = orbitActive ? clamp(-b.orbYv * 0.16, 0, 0.75) : 0;
        let coverBBase = 0;
        if (inDetail) {
          const nearestBack =
            Math.round((b.orbY - Math.PI) / 6.2832) * 6.2832 + Math.PI;
          const activityB = clamp(
            Math.abs(b.orbYv) * 1.5 +
              (orbit.drag ? 1 : 0) +
              Math.abs(b.orbY - nearestBack) * 2,
            0,
            1,
          );
          coverBBase =
            (0.1 + Math.sin(t * 0.8 + b.phase + 1.7) * 0.012 * idle) *
            (1 - activityB);
        }

        if (isHov && ptr.seen && state.mode === "hero") {
          const dxN = (ptr.cx - b.scr.x) / (innerWidth * 0.25);
          const dyN = (b.scr.y - ptr.cy) / (innerHeight * 0.3);
          s.tiltY.t = clamp(dxN * 0.28, -0.15, 0.15);
          s.tiltX.t = clamp(-dyN * 0.1, -0.09, 0.1);
          s.lift.t = 0.3;
          const edge = b.hitEdge != null ? b.hitEdge : 0.5;
          coverBase = 0.085 + edge * 0.16 + clamp(dyN, 0, 1) * 0.09;
        } else {
          s.tiltY.t = 0;
          s.tiltX.t = 0;
          s.lift.t = 0;
        }
        s.cover.t = coverBase + fan;
        s.coverB.t = coverBBase + fanB;
        s.sc.t = b.slotScale * (isHov && state.mode === "hero" ? 1.09 : 1);

        s.px.update(dt);
        if (b.exit) stepY(b, dt);
        else s.py.update(dt);
        s.pz.update(dt);
        s.rx.update(dt);
        s.ry.update(dt);
        s.rz.update(dt);
        s.sc.update(dt);
        s.tiltX.update(dt);
        s.tiltY.update(dt);
        s.lift.update(dt);
        s.cover.update(dt);
        s.coverB.update(dt);
        s.drag.update(dt);

        b.float.position.y = Math.sin(t * 0.7 + b.phase) * 0.035 * idle;
        b.float.rotation.z = Math.sin(t * 0.9 + b.phase * 1.7) * 0.006 * idle;

        b.root.position.set(s.px.v, s.py.v, s.pz.v + s.lift.v);
        const sway = inDetail
          ? Math.sin(t * 0.45 + b.phase) * 0.035 * idle * (1 - activity)
          : 0;
        const swing = clamp(-s.px.vel * 0.12, -0.5, 0.5);
        b.root.rotation.set(
          s.rx.v + s.tiltX.v + b.orbXs.v,
          s.ry.v + s.tiltY.v + b.orbY + sway + swing,
          s.rz.v,
        );
        b.root.scale.setScalar(Math.max(s.sc.v, 0.001));

        const ang = Math.max(0, s.cover.v + s.drag.v);
        const angB = Math.max(0, s.coverB.v);
        b.pivot.rotation.y = -ang;
        b.pivot.position.z = PIVOT_Z + ang * 0.022;
        b.backPivot.rotation.y = angB;
        b.backPivot.position.z = BPIVOT_Z - angB * 0.022;
        b.spine.rotation.y = -ang * 0.16 + angB * 0.16;
        b.block.scale.z = 1 - (ang + angB) * 0.05;
        b.block.position.z = BLOCK_Z - ang * 0.006 + angB * 0.006;
        for (let i = 0; i < PAGE_N; i++) {
          const fl =
            idle *
            Math.sin(t * 1.15 + b.phase + i * 0.6) *
            0.006 *
            (1 - i / PAGE_N);
          b.pages[i].rotation.y = -(ang * b.pageF[i] + Math.max(0, fl));
        }
        for (let i = 0; i < 6; i++) b.pagesB[i].rotation.y = angB * b.pageFB[i];
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        /* hover resolution */
        if (ptr.seen && (ptr.type === "mouse" || ptr.down)) castRay();
        let hov = null;
        if (state.mode === "hero") {
          hov =
            rayBook ||
            state.pillLock ||
            (state.kbIndex >= 0 ? books[state.kbIndex] : null);
        } else if (state.mode === "detail") {
          hov = rayBook === state.selected ? rayBook : null;
        }
        state.hovered = hov;
        let cur = "default";
        if (state.mode === "hero" && hov) cur = "pointer";
        else if (state.mode === "detail" && state.selected) {
          if (orbit.drag) cur = "grabbing";
          else if (rayBook === state.selected) cur = "grab";
        }
        canvas.style.cursor = cur;

        books.forEach((b) => screenPos(b));
        books.forEach((b) => tickBook(b, dt, t));
        leaves.update(dt, t);

        /* scene parallax */
        parX.t = RM ? 0 : ptr.ndcX * 0.02;
        parY.t = RM ? 0 : -ptr.ndcY * 0.012;
        bookRoot.rotation.y = parX.update(dt);
        bookRoot.rotation.x = parY.update(dt);

        /* camera */
        camera.position.set(camX.update(dt), camY.update(dt), camZ.update(dt));
        camera.lookAt(lookX.update(dt), lookY.update(dt), 0);

        /* open slip: rides just under the cursor while it is over a book. it is
           a cursor affordance, so touch never shows it — there a tap just opens */
        if (
          state.mode === "hero" &&
          state.hovered &&
          ptr.seen &&
          !isTouch() &&
          !(ptr.down && ptr.moved > 14)
        ) {
          if (pill.dataset.libro !== state.hovered.cfg.id) {
            pill.dataset.libro = state.hovered.cfg.id;
            pill.textContent = "Ver " + state.hovered.cfg.title;
          }
          const tx = ptr.cx,
            ty = ptr.cy + 34;
          if (!pillOn) {
            pillX.set(tx);
            pillY.set(ty);
            pillOn = true;
          }
          pillX.t = tx;
          pillY.t = ty;
          pill.style.left = pillX.update(dt) + "px";
          pill.style.top = pillY.update(dt) + "px";
          pill.classList.add("on");
        } else {
          hidePill();
        }

        renderer.render(scene, camera);
      }

      /* =========================================================================
   9. Entrance + resize
   ========================================================================= */
      computeSlots();
      books.forEach((b, i) => {
        const slot = SLOTS.hero[i];
        const s = b.springs;
        s.px.set(slot.p[0]);
        s.py.set(slot.p[1] - 3.9);
        s.pz.set(slot.p[2]);
        s.rx.set(slot.r[0]);
        s.ry.set(slot.r[1]);
        s.rz.set(slot.r[2] + 0.35 * (i === 1 ? -1 : Math.sign(slot.p[0])));
        s.sc.set(slot.s);
        b.slotScale = slot.s;
        setTimeout(() => setTargets(b, slot), 240 + i * 150);
      });
      camTo("hero");

      function relayout() {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        computeSlots();
        applyMode();
        camTo(
          state.mode === "detail" || state.mode === "opening"
            ? "detail"
            : "hero",
        );
      }

      window.addEventListener("resize", relayout);
      /* phones: rotation reports stale dimensions for a beat, and the address bar
         collapsing changes the height without always firing a window resize */
      window.addEventListener("orientationchange", () => {
        relayout();
        setTimeout(relayout, 250);
      });
      if (window.visualViewport)
        window.visualViewport.addEventListener("resize", relayout);

      animate();
    </script>
  </body>
</html>
