<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Perfil · Museario</title>
  <link rel="icon" type="image/svg+xml" href="/museario/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0d;
      color: #ece8df;
      font-family: 'Poppins', 'Helvetica Neue', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(ellipse 70% 45% at 50% -8%, rgba(201, 163, 92, 0.08), transparent 55%),
        linear-gradient(rgba(236, 232, 223, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 232, 223, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 44px 44px, 44px 44px;
      mask-image: radial-gradient(ellipse 95% 90% at 50% 20%, black 55%, transparent);
    }
    .fondo-img {
      position: fixed; inset: 0; z-index: 0;
      background-position: center; background-size: cover;
    }
    .fondo-img::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11, 11, 13, 0.78) 0%, rgba(11, 11, 13, 0.9) 100%);
    }
    main {
      position: relative; z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      padding: 54px 18px 60px;
      text-align: center;
    }
    .foto {
      width: 116px; height: 116px;
      border-radius: 32px;
      object-fit: cover;
      background: #1b1b1e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-bottom: 18px;
      animation: aparecer 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.1rem;
      margin: 0 0 4px;
    }
    .handle { color: #c9a35c; font-size: 0.82rem; margin: 0 0 16px; }
    .bio { color: #a59d8f; font-size: 0.88rem; line-height: 1.65; margin: 0 auto 26px; max-width: 34em; }
    /* redes */
    .redes { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin-bottom: 38px; }
    .red {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: #ece8df; text-decoration: none;
      font-size: 0.74rem; font-weight: 400;
      padding: 9px 16px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .red:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-2px); }
    .red svg { width: 14px; height: 14px; flex-shrink: 0; }
    /* museos */
    .titulo-sec {
      font-size: 0.66rem; letter-spacing: 0.28em; text-transform: uppercase;
      color: #8d8579; margin: 0 0 18px;
    }
    .museos { display: flex; flex-direction: column; gap: 16px; margin-bottom: 44px; }
    .museo {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #141416 center/cover;
      text-align: left;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .museo:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.32); }
    .museo .velo {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(8, 8, 10, 0.88) 25%, rgba(8, 8, 10, 0.3));
    }
    .museo .in { position: relative; padding: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .museo h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.35rem; margin: 0; }
    .museo .meta { color: #b8b0a1; font-size: 0.72rem; margin-top: 2px; }
    .museo .acciones { display: flex; gap: 8px; }
    .museo .btn-m {
      background: #ece8df; color: #16130f;
      border-radius: 999px; text-decoration: none;
      font-size: 0.64rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 9px 16px;
      transition: background 0.2s ease;
    }
    .museo .btn-m:hover { background: #fff; }
    .museo .btn-m.ghost { background: rgba(12, 12, 14, 0.55); color: #ece8df; border: 1px solid rgba(255, 255, 255, 0.35); }
    .museo .btn-m.ghost:hover { background: rgba(255, 255, 255, 0.14); }
    .pie { color: #6d675d; font-size: 0.72rem; }
    .pie a { color: #a59d8f; text-decoration: none; }
    .pie a:hover { color: #ece8df; }
    .error-carga { color: #a59d8f; padding: 60px 0; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .anim { animation: aparecer 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @media (prefers-reduced-motion: reduce) { .anim, .foto { animation: none; } }
  </style>
</head>
<body>
  <main id="main">
    <p class="error-carga" id="cargando">Cargando…</p>
  </main>

  <script type="module">
    const API_BASE = ['5173', '4173'].includes(location.port) ? 'https://museario.art' : ''
    const slug = (location.pathname.match(/^\/a\/([^/]+)/) || [])[1] ||
      new URLSearchParams(location.search).get('a') || ''
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')

    const ICONOS = {
      instagram: 'Instagram', web: 'Sitio web', substack: 'Substack', behance: 'Behance',
      youtube: 'YouTube', tiktok: 'TikTok', facebook: 'Facebook', x: 'X', whatsapp: 'WhatsApp',
    }
    const SVGS = {
      instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1-3.2 0-3.6 0-4.8-.1-3.3-.1-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.8s0-3.6.1-4.8C2.4 4 4 2.4 7.2 2.3c1.2-.1 1.6-.1 4.8-.1zM12 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zm0 10.2a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>',
      web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>',
      substack: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.5 8.2H1.5V5.4h21zM1.5 10.8V24L12 18.1 22.5 24V10.8zM22.5 0H1.5v2.8h21z"/></svg>',
      behance: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 5.2c.8 0 1.5.1 2.2.2.6.2 1.2.4 1.6.7.5.3.8.8 1 1.3.3.5.4 1.2.4 2 0 .9-.2 1.6-.6 2.2-.4.6-1 1-1.8 1.4 1.1.3 1.9.9 2.4 1.6.5.8.8 1.7.8 2.8 0 .9-.2 1.6-.5 2.3-.3.6-.8 1.2-1.4 1.6-.6.4-1.2.7-2 .9-.7.2-1.5.3-2.3.3H0V5.2zM7.7 12c.7 0 1.2-.2 1.7-.5.4-.3.6-.8.6-1.5 0-.4-.1-.7-.2-1-.1-.2-.3-.4-.6-.6-.2-.1-.5-.2-.8-.3H3.5V12zm.3 7.2c.4 0 .7 0 1-.1.3-.1.6-.2.9-.4.2-.2.4-.4.6-.7.1-.3.2-.7.2-1.1 0-.9-.2-1.5-.7-1.9-.5-.4-1.2-.5-2-.5h-4v4.7zM16.7 6.3h6.5V8h-6.5zM24 16c0 .2 0 .5-.1.7h-7.6c0 .9.3 1.6.8 2 .5.4 1.1.6 1.9.6.6 0 1.1-.1 1.5-.4.4-.3.7-.6.8-1h2.5c-.4 1.3-1 2.2-1.9 2.8-.8.6-1.9.9-3 .9-.8 0-1.6-.1-2.3-.4-.7-.3-1.2-.7-1.7-1.2s-.8-1.1-1.1-1.8c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3.3-.7.6-1.3 1.1-1.8.5-.5 1-.9 1.7-1.2.7-.3 1.4-.4 2.2-.4.9 0 1.7.2 2.3.5.7.3 1.2.8 1.7 1.4.4.6.7 1.2.9 2 .2.6.3 1.3.3 1.9zm-2.9-.9c-.1-.7-.3-1.3-.7-1.7-.4-.4-1-.6-1.7-.6-.5 0-.9.1-1.2.2-.3.2-.6.4-.8.6-.2.2-.3.5-.4.8-.1.2-.1.5-.2.7z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6.3 3.5z"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 5.8a5 5 0 0 1-3.5-4.2V1h-3.4v13.7a2.9 2.9 0 1 1-2.1-2.8V8.4a6.3 6.3 0 1 0 5.5 6.3V8.6a8.3 8.3 0 0 0 4.6 1.4V6.6c-.4 0-.8-.3-1.1-.8z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12z"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.2 2.3h3.5l-7.6 8.7L23 22.8h-7L10.5 15l-6.3 7.8H.7l8.1-9.3L.2 2.3h7.2l5 6.9zm-1.2 18.4h1.9L6.4 4.3H4.3z"/></svg>',
      whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.2zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4a9.8 9.8 0 1 1 8.3 4.6zM12 .2A11.8 11.8 0 0 0 1.9 18L.2 24l6.2-1.6A11.8 11.8 0 1 0 12 .2z"/></svg>',
    }
    const urlRed = (tipo, v) => {
      if (/^https?:\/\//i.test(v)) return v
      const u = v.replace(/^@/, '')
      switch (tipo) {
        case 'behance': return `https://www.behance.net/${u}`
        case 'youtube': return `https://www.youtube.com/@${u}`
        case 'tiktok': return `https://www.tiktok.com/@${u}`
        case 'facebook': return `https://www.facebook.com/${u}`
        case 'x': return `https://x.com/${u}`
        case 'substack': return `https://${u}.substack.com`
        default: return v
      }
    }

    async function cargar() {
      const main = document.getElementById('main')
      let a
      try {
        const r = await fetch(`${API_BASE}/api/m/a/${encodeURIComponent(slug)}`)
        if (!r.ok) throw new Error()
        a = await r.json()
      } catch {
        main.innerHTML = '<p class="error-carga">No encontramos este perfil.<br /><br /><a style="color:#a59d8f" href="/">← Volver a Museario</a></p>'
        return
      }
      document.title = `${a.nombre} — Museario`

      if (a.fondo) {
        const f = document.createElement('div')
        f.className = 'fondo-img'
        f.style.backgroundImage = `url('${esc(a.fondo)}')`
        document.body.prepend(f)
      }
      const foto = a.profileImage || a.logoBlanco
      const redes = []
      if (a.instagramUrl) redes.push(['instagram', a.instagramUrl])
      if (a.website) redes.push(['web', a.website])
      if (a.substack) redes.push(['substack', a.substack])
      for (const k of ['behance', 'youtube', 'tiktok', 'facebook', 'x']) {
        if (a.redes && a.redes[k]) redes.push([k, urlRed(k, a.redes[k])])
      }
      if (a.redes && a.redes.telefono) {
        redes.push(['whatsapp', `https://wa.me/${a.redes.telefono.replace(/[^\d]/g, '')}`])
      }

      main.innerHTML =
        (foto ? `<img class="foto" src="${esc(foto)}" alt="${esc(a.nombre)}" />` : '') +
        `<h1 class="anim" style="animation-delay:.05s">${esc(a.nombre)}</h1>` +
        (a.handle ? `<p class="handle anim" style="animation-delay:.1s">${esc(a.handle)}</p>` : '') +
        (a.bioEs ? `<p class="bio anim" style="animation-delay:.15s">${esc(a.bioEs)}</p>` : '') +
        (redes.length
          ? `<div class="redes anim" style="animation-delay:.2s">` +
            redes.map(([k, u]) =>
              `<a class="red" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${SVGS[k] || ''}${ICONOS[k] || k}</a>`).join('') +
            `</div>`
          : '') +
        (a.colecciones.length
          ? `<p class="titulo-sec anim" style="animation-delay:.25s">Museos</p><div class="museos" id="museos"></div>`
          : '') +
        `<p class="pie anim" style="animation-delay:.4s">Hecho con <a href="/">Museario</a> — cada artista, su museo</p>`

      const cont = document.getElementById('museos')
      if (cont) {
        a.colecciones.forEach((c, i) => {
          const el = document.createElement('div')
          el.className = 'museo anim'
          el.style.animationDelay = `${0.28 + i * 0.07}s`
          if (c.portadaUrl) el.style.backgroundImage = `url('${esc(c.portadaUrl)}')`
          el.innerHTML =
            `<div class="velo"></div><div class="in">` +
            `<div><h2>${esc(c.nombre)}</h2><div class="meta">${esc(c.subtitulo || '')}</div></div>` +
            `<div class="acciones">` +
            `<a class="btn-m" href="/a/${esc(a.slug)}/${esc(c.slug)}">Museo 3D</a>` +
            `<a class="btn-m ghost" href="/a/${esc(a.slug)}/${esc(c.slug)}/galeria">Galería</a>` +
            `</div></div>`
          cont.appendChild(el)
        })
      }
    }
    cargar()
  </script>
</body>
</html>
