<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Mi cuenta · Museario</title>
  <link rel="icon" type="image/jpeg" href="/cat-profile.jpg" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0c0c0e;
      color: #ece8df;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .marca {
      font-size: 13px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #8d8579;
      margin: 0 0 30px;
    }
    .tarjeta {
      width: min(380px, 92vw);
      background: #141416;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 34px 30px 30px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; letter-spacing: 0.04em; margin: 0 0 6px; }
    .sub { color: #8d8579; font-size: 0.85rem; margin: 0 0 26px; line-height: 1.5; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 0;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      background: #ece8df;
      color: #16130f;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #fff; }
    .btn-ghost {
      background: transparent;
      color: #ece8df;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.09); }
    .foto {
      width: 74px; height: 74px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .correo { color: #8d8579; font-size: 0.8rem; margin: 2px 0 22px; }
    .nota {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #6d675d;
      font-size: 0.76rem;
      line-height: 1.55;
    }
    .error { color: #d98a7f; font-size: 0.8rem; margin: 0 0 16px; }
    .pie { margin-top: 26px; font-size: 0.74rem; letter-spacing: 0.08em; color: #6d675d; }
    .pie a { color: #a59d8f; text-decoration: none; }
    .pie a:hover { color: #ece8df; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p class="marca">Museario</p>

  <!-- Sin sesión -->
  <div class="tarjeta" id="vista-login" hidden>
    <h1>Entrar a Museario</h1>
    <p class="sub">El espacio donde cada artista tiene su propio museo.</p>
    <p class="error" id="login-error" hidden></p>
    <a class="btn" href="/api/auth/google">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.46a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.1 3.56-5.18 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.28a12 12 0 0 0 0 10.78l4.01-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44A11.96 11.96 0 0 0 12 0 12 12 0 0 0 1.28 6.61l4.01 3.1C6.23 6.88 8.88 4.77 12 4.77z"/></svg>
      Continuar con Google
    </a>
  </div>

  <!-- Con sesión -->
  <div class="tarjeta" id="vista-perfil" hidden>
    <img class="foto" id="perfil-foto" src="" alt="" hidden />
    <h1 id="perfil-nombre"></h1>
    <p class="correo" id="perfil-correo"></p>
    <button class="btn btn-ghost" id="btn-salir">Cerrar sesión</button>
    <p class="nota">Tu cuenta está creada. El <strong>panel de artista</strong> —para subir obras y armar tu museo— está en construcción: te avisaremos cuando esté listo.</p>
  </div>

  <p class="pie"><a href="/">← Volver a los museos</a></p>

  <script type="module">
    const vLogin = document.getElementById('vista-login')
    const vPerfil = document.getElementById('vista-perfil')

    const err = new URLSearchParams(location.search).get('error')
    if (err) {
      const el = document.getElementById('login-error')
      el.textContent = 'No se pudo iniciar sesión. Inténtalo de nuevo.'
      el.hidden = false
    }

    try {
      const r = await fetch('/api/auth/yo')
      if (r.ok) {
        const u = await r.json()
        document.getElementById('perfil-nombre').textContent = u.nombre || u.email
        document.getElementById('perfil-correo').textContent = u.email
        const foto = document.getElementById('perfil-foto')
        if (u.foto) { foto.src = u.foto; foto.hidden = false }
        vPerfil.hidden = false
      } else {
        vLogin.hidden = false
      }
    } catch {
      vLogin.hidden = false
    }

    document.getElementById('btn-salir').addEventListener('click', async () => {
      await fetch('/api/auth/salir', { method: 'POST' })
      location.reload()
    })
  </script>
</body>
</html>
