<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitas · Museo Virtual</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d0d10; color: #ece8df; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card { width: 100%; max-width: 520px; }
    h1 { font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: #8d8579; margin: 0 0 6px; }
    .total { font-size: 64px; font-weight: 700; margin: 0 0 4px; }
    .sub { color: #8d8579; font-size: 13px; margin: 0 0 28px; }
    h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #8d8579; margin: 26px 0 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
    td:last-child { text-align: right; font-weight: 700; }
    .err { color: #d98a6a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Museo Virtual · Visitas</h1>
    <p class="total" id="total">…</p>
    <p class="sub">visitas totales (una por pestaña y página)</p>
    <h2>Por página</h2>
    <table id="paginas"></table>
    <h2>Últimos días</h2>
    <table id="dias"></table>
  </div>
  <script>
    const NOMBRES = {
      'museo-danni': 'Museo 3D · Danní',
      'galeria-danni': 'Galería · Danní',
      'museo-conexiones': 'Museo 3D · Conexiones',
      'conexiones': 'Galería · Conexiones',
      'rumiaciones': 'Galería · Rumiaciones',
    }
    fetch('/api/visitas').then(r => r.json()).then(d => {
      document.getElementById('total').textContent = (d.total || 0).toLocaleString('es-CO')
      const pag = Object.entries(d.paginas || {}).sort((a, b) => b[1] - a[1])
      document.getElementById('paginas').innerHTML = pag
        .map(([k, v]) => `<tr><td>${NOMBRES[k] || k}</td><td>${v.toLocaleString('es-CO')}</td></tr>`)
        .join('') || '<tr><td>Sin datos aún</td><td>—</td></tr>'
      const dias = Object.entries(d.dias || {}).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 14)
      document.getElementById('dias').innerHTML = dias
        .map(([k, v]) => `<tr><td>${k}</td><td>${v.toLocaleString('es-CO')}</td></tr>`)
        .join('') || '<tr><td>Sin datos aún</td><td>—</td></tr>'
    }).catch(() => {
      document.getElementById('total').innerHTML = '<span class="err">sin conexión al contador</span>'
    })
  </script>
</body>
</html>
