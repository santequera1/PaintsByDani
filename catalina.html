<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Catalina Olivero · Museo Virtual</title>
  <link rel="icon" type="image/jpeg" href="/cat-profile.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Catalina Olivero" />
  <meta property="og:title" content="Catalina Olivero — Museo Virtual" />
  <meta property="og:description" content="Tres colecciones para recorrer: Rumiaciones, Conexiones y Alma. Museos 3D y galerías interactivas." />
  <meta property="og:image" content="https://museo.wailus.co/cat-og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://museo.wailus.co/catalina.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://museo.wailus.co/cat-og.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0c0c0e;
      color: #ece8df;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 16px 28px;
    }
    .logo {
      width: min(230px, 62vw);
      filter: invert(1);
      margin-bottom: 10px;
      user-select: none;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #8d8579;
      margin: 4px 0 34px;
    }
    .cards {
      display: flex;
      gap: 36px;
      max-width: 1060px;
      width: 100%;
      justify-content: center;
      /* móvil: slider con snap */
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 4px 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.25) transparent;
    }
    .card {
      flex: 0 0 min(300px, 82vw);
      scroll-snap-align: center;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.25s ease;
    }
    .card:hover { border-color: rgba(255, 255, 255, 0.28); z-index: 2; }
    .card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #1c1c1f;
    }
    .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
    .card h2 {
      margin: 0 0 2px;
      font-size: 1.15rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .card .years {
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      color: #8d8579;
      margin: 0 0 16px;
    }
    .card .acciones { margin-top: auto; display: flex; flex-direction: column; gap: 9px; }
    .card a.btn {
      display: block;
      text-align: center;
      padding: 11px 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .btn-museo { background: #ece8df; color: #16130f; }
    .btn-museo:hover { background: #fff; }
    .btn-galeria { color: #ece8df; border: 1px solid rgba(255, 255, 255, 0.3); }
    .btn-galeria:hover { background: rgba(255, 255, 255, 0.09); }
    .pie {
      margin-top: 26px;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: #6d675d;
    }
    .pie a { color: #a59d8f; text-decoration: none; }
    .pie a:hover { color: #ece8df; }
    @media (max-width: 720px) {
      body { padding-top: 30px; }
      .cards { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/cat-logo-negro.svg" alt="Catalina Olivero" />
  <p class="kicker">Museo Virtual · Colecciones</p>

  <div class="cards">
    <article class="card">
      <img class="card-img" src="/cat-posts/thumb/Me%20siento%20conectada%20a%20este%20parque,%202026.webp" alt="Rumiaciones" loading="lazy" />
      <div class="card-body">
        <h2>Rumiaciones</h2>
        <p class="years">2026</p>
        <div class="acciones">
          <a class="btn btn-museo" href="./museo-rumiaciones.html">Museo 3D</a>
          <a class="btn btn-galeria" href="./rumiaciones.html?entrar">Galería en lienzo</a>
        </div>
      </div>
    </article>

    <article class="card">
      <img class="card-img" src="/conexiones-posts/thumb/Oc%C3%A9ano,%202022.webp" alt="Conexiones" loading="lazy" />
      <div class="card-body">
        <h2>Conexiones</h2>
        <p class="years">2022 – Presente</p>
        <div class="acciones">
          <a class="btn btn-museo" href="./museo.html">Museo 3D</a>
          <a class="btn btn-galeria" href="./conexiones.html?entrar">Galería en lienzo</a>
        </div>
      </div>
    </article>

    <article class="card">
      <img class="card-img" src="/alma-posts/thumb/Energia,%202024.webp" alt="Alma" loading="lazy" />
      <div class="card-body">
        <h2>Alma</h2>
        <p class="years">2022 – 2025</p>
        <div class="acciones">
          <a class="btn btn-museo" href="./museo-alma.html">Museo 3D</a>
          <a class="btn btn-galeria" href="./alma.html?entrar">Galería en lienzo</a>
        </div>
      </div>
    </article>
  </div>

  <p class="pie"><a href="https://www.instagram.com/catalinaoliveroart/" target="_blank" rel="noopener noreferrer">@catalinaoliveroart</a></p>

  <script type="module">
    import { contarVisita } from '/src/misc/visitas.js'
    import VanillaTilt from 'vanilla-tilt'
    contarVisita('catalina-hub')

    // mismo efecto 3D de las galerias de lienzo
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    if (!reduce && window.matchMedia('(hover: hover)').matches) {
      VanillaTilt.init([...document.querySelectorAll('.card')], {
        max: 7, speed: 900, scale: 1.02, perspective: 1100,
        glare: true, 'max-glare': 0.16, gyroscope: false,
      })
    }
  </script>
</body>
</html>
